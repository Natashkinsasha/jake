description: "Jake English Tutor — LLM Evaluation Suite"

prompts:
  - label: chat
    raw: |
      [
        {"role": "system", "content": "{{system}}"},
        {"role": "user", "content": "{{message}}"}
      ]

providers:
  # Same model settings as the API's "main" profile (apps/api/src/@logic/llm/src/anthropic-llm.provider.ts)
  - id: anthropic:messages:claude-sonnet-5-5
    config:
      max_tokens: 1024
      thinking:
        type: between_tools
      effort: low

defaultTest:
  options:
    # Sonnet 5.5 rejects promptfoo's default temperature 0; setting thinking makes promptfoo omit it
    provider:
      id: anthropic:messages:claude-sonnet-5-5
      config:
        max_tokens: 2048
        thinking:
          type: between_tools
        effort: high
    # Strip markdown code blocks from JSON responses
    transform: "output.replace(/^```(?:json)?\\n?/gm, '').replace(/^```$/gm, '').replace(/<emotion>\\w+<\\/emotion>/g, '').trim()"

tests:
  - file://datasets/greeting-cases.yaml
  - file://datasets/post-lesson-cases.yaml
  - file://datasets/fact-extraction-cases.yaml
